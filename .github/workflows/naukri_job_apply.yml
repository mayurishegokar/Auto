name: Naukri Auto Job Apply

on:
  # Trigger on commit push to master branch
  push:
    branches:
      - master
  # Schedule: 3 times every day (9:00 AM, 2:00 PM, 5:00 PM IST)
  schedule:
    - cron: '30 3 * * *'   # 09:00 AM IST (03:30 UTC)
    - cron: '30 8 * * *'   # 02:00 PM IST (08:30 UTC)
    - cron: '30 11 * * *'  # 05:00 PM IST (11:30 UTC)
  # Manual trigger with option to run on master branch
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run on'
        required: true
        default: 'master'

jobs:
  apply_jobs:
    name: Run Job Application Bot
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Maximum run duration of 15 minutes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'master' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Job Apply Bot
        env:
          CI: "true"
          HEADLESS: "true"
          NAUKRI_EMAIL: ${{ secrets.NAUKRI_EMAIL }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
          JOB_KEYWORDS: ${{ vars.JOB_KEYWORDS || 'Software Developer, Java Developer, React Developer' }}
          JOB_LOCATION: ${{ vars.JOB_LOCATION || '' }}
          MAX_PAGES: "3"
          MAX_JOBS_PER_PAGE: "20"
        run: |
          python Jobapply.py

      - name: Upload Debug Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: "screenshots/*.png"
          if-no-files-found: ignore
